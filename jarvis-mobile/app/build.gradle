plugins {
    id "com.android.application"
}

import java.util.Properties
import java.io.FileInputStream

def readEnvFile(File file) {
    def values = new Properties()
    if (!file.exists()) {
        return values
    }
    file.eachLine { raw ->
        def line = raw.trim()
        if (!line || line.startsWith("#") || !line.contains("=")) {
            return
        }
        def idx = line.indexOf("=")
        def key = line.substring(0, idx).trim()
        def value = line.substring(idx + 1).trim()
        if ((value.startsWith("\"") && value.endsWith("\"")) || (value.startsWith("'") && value.endsWith("'"))) {
            value = value.substring(1, value.length() - 1)
        }
        values.setProperty(key, value)
    }
    return values
}

def rootEnv = readEnvFile(rootProject.file("../.env"))
def localEnv = readEnvFile(rootProject.file(".env"))
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

def envValue = { name ->
    def fromLocal = localEnv.getProperty(name)
    if (fromLocal != null && !fromLocal.trim().isEmpty()) {
        return fromLocal
    }
    def fromRoot = rootEnv.getProperty(name)
    return fromRoot == null ? "" : fromRoot
}

def quote = { value ->
    return "\"" + value.replace("\\", "\\\\").replace("\"", "\\\"") + "\""
}

android {
    namespace "com.jarvis.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.jarvis.mobile"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        [
                "GROQ_API_KEY",
                "GROQ_API_KEY2",
                "GROQ_API_KEY3",
                "GROQ_API_KEY4",
                "TAVILY_API_KEY",
                "OPENROUTER_API_KEY",
                "GEMINI_API_KEY",
                "OPENWEATHER_API_KEY",
                "NEWSAPI_KEY",
                "ALPHA_VANTAGE_KEY",
                "YOUTUBE_API_KEY",
                "ELEVENLABS_API_KEY",
                "SERPAPI_KEY",
                "RESEND_API_KEY",
                "TMDB_API_KEY",
                "NASA_API_KEY",
                "FINNHUB_API_KEY",
                "API_NINJAS_KEY",
                "CALENDARIFIC_API_KEY"
        ].each { key ->
            buildConfigField "String", key, quote(envValue(key))
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
            shrinkResources false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        missingDimensionStrategy 'store', 'play'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}